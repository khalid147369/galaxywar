services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-odyssey}
      POSTGRES_USER: ${DATABASE_USER:-odyssey}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - odyssey-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-odyssey} -d ${DATABASE_NAME:-odyssey}"]
      interval: 5s
      timeout: 5s
      retries: 10

  game-server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: ${PORT:-8080}
      TLS_ENABLED: ${TLS_ENABLED:-false}
      TLS_CERTIFICATE_PATH: ${TLS_CERTIFICATE_PATH:-}
      TLS_PRIVATE_KEY_PATH: ${TLS_PRIVATE_KEY_PATH:-}
      TLS_PRIVATE_KEY_PASSWORD: ${TLS_PRIVATE_KEY_PASSWORD:-}
      TLS_CERTIFICATE_BASE64: ${TLS_CERTIFICATE_BASE64:-}
      TLS_PRIVATE_KEY_BASE64: ${TLS_PRIVATE_KEY_BASE64:-}
      DATABASE_HOST: database
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-odyssey}
      DATABASE_USER: ${DATABASE_USER:-odyssey}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      DATABASE_SSLMODE: ${DATABASE_SSLMODE:-prefer}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-8}
      ROOM_MAX_PLAYERS: ${ROOM_MAX_PLAYERS:-2}
      TICK_RATE_HZ: ${TICK_RATE_HZ:-20}
      RECONNECT_TTL_SECONDS: ${RECONNECT_TTL_SECONDS:-300}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    depends_on:
      database:
        condition: service_healthy

volumes:
  odyssey-postgres:
